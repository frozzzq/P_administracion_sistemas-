<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>404 — Página no encontrada</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .error-box {
            text-align: center;
            padding: 80px 20px;
        }
        .error-box h1 {
            font-size: 5em;
            color: #9c27b0;
        }
        .error-box p {
            color: #b0b0c0;
            margin: 20px 0;
        }
        .error-box a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 24px;
            background: #9c27b0;
            color: white;
            border-radius: 6px;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="error-box">
        <h1>404</h1>
        <p>La página que buscas no existe.</p>
        <a href="/">Volver al inicio</a>
    </div>
</body>
</html>
