# =============================================================================
# nginx.conf — Configuración Nginx segura
# - server_tokens off: no expone versión del servidor
# - Puerto 8080: compatible con usuario no-root
# - Sirve archivos estáticos desde /var/www/html
# =============================================================================

worker_processes auto;
pid /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Eliminar firma del servidor (no expone version de Nginx)
    server_tokens off;

    sendfile on;
    keepalive_timeout 65;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    server {
        listen 8080;
        server_name _;

        root /var/www/html;
        index index.html;

        # Archivos estaticos
        location / {
            try_files $uri $uri/ =404;
        }

        # Carpeta de archivos subidos via FTP (prueba 10.3)
        location /uploads/ {
            alias /var/www/html/uploads/;
            autoindex on;
        }

        # Pagina de error personalizada
        error_page 404 /404.html;
    }
}
